<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anfrage - Poolbauprofi.at</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Poolbauprofi.at Logo">
            <h1>POOL BAUPROFI.AT</h1>
        </div>
    </header>

    <main>
        <div class="content">
            <div class="left-section">
                <h2>Anfrage</h2>
            </div>
            
            <div class="middle-section">
                <h3>Kontakt</h3>
                <p>+43 660 8669020</p>
                <p>office@poolbauprofi.at</p>
            </div>
            
            <div class="right-section">
                <form>
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-Mail (erforderlich):</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Nachricht:</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                    
                    <button type="submit">Absenden</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <hr>
        <div class="footer-content">
            <div class="left">
                <p>© Poolbauprofi.at</p>
                <p>Bloggen auf WordPress.com.</p>
            </div>
            
            <div class="middle">
                <p>AUSTRIA</p>
                <h4>Kontakt</h4>
                <p>E-Mail: office@poolbauprofi.at</p>
                <p>Mobil: +43 660 8669020</p>
            </div>
            
            <div class="right">
                <h4>Folge uns</h4>
                <p>Facebook / Instagram</p>
            </div>
        </div>
    </footer>
</body>
</html>
