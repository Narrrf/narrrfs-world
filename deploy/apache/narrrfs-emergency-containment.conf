# Narrrfs World SEV-1 emergency containment.
#
# This deliberately disables the unverified admin surface and direct database
# delivery. Re-enable individual routes only after a separately approved,
# fail-closed server-authorization review.

# The runtime database and tracked SQL metadata currently live below the
# Apache document root. Deny both URL and filesystem access.
<LocationMatch "(?i)^/db(?:/|$)">
    Require all denied
</LocationMatch>

<Directory "/var/www/html/db">
    Require all denied
</Directory>

# Defense in depth for database, journal, SQL, and backup-like files placed
# anywhere else under a served directory.
<FilesMatch "(?i)\.(?:(?:sqlite(?:3)?|db)(?:-(?:wal|shm))?|sql|wal|shm|bak|backup)(?:\..*)?$">
    Require all denied
</FilesMatch>

# The static admin page is not an authorization boundary and must not be
# delivered while the admin API surface is under review.
<LocationMatch "(?i)^/admin-interface\.html(?:/|$)">
    Require all denied
</LocationMatch>

# Emergency default deny: no admin API exception is approved in this patch.
<LocationMatch "(?i)^/api/admin(?:/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "(?i)^/api/track-egg-click\.php(?:/|$)">
    Require all denied
</LocationMatch>

# Owner Control exposes only exact, server-guarded paths.
#
# Bug Tracker A1 is deliberately limited to one CSRF issuer and one owner-only
# update endpoint. Both remain default-off through their server-side policies;
# this exception never reopens a legacy admin or development route.
# Every other owner-control path, path-info suffix, or case variant stays denied.
<LocationMatch "^(?!(?:/api/owner-control/v1/canary\.php|/api/owner-control/v1/genetic/catalog\.php|/api/owner-control/v1/quests/overview\.php|/api/owner-control/v1/lab-store/offers\.php|/api/owner-control/v1/lab-store/drafts\.php|/api/owner-control/v1/lab-store/draft-details\.php|/api/owner-control/v1/lab-store/draft-create\.php|/api/owner-control/v1/lab-store/draft-update\.php|/api/owner-control/v1/lab-store/draft-csrf\.php|/api/owner-control/v1/bug-tracker\.php|/api/owner-control/v1/bug-tracker-details\.php|/api/owner-control/v1/csrf\.php|/api/owner-control/v1/bug-tracker-update\.php)$)(?i:/api/owner-control)(?:/|$)">
    Require all denied
</LocationMatch>

# Named database utilities outside /api/admin are independently denied.
<LocationMatch "(?i)^/api/dev/(?:download-db|db-viewer|db-viewer-data|upload-db)\.php(?:/|$)">
    Require all denied
</LocationMatch>
