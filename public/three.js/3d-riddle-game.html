<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>3D Riddle Game - Narrrf's World</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>

    <!-- 🧀 Tailwind – needed for trophy shelf styling (same as profile.html) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🎮 Mobile Joystick Library (nipplejs) - Required for mobile ground controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <!-- Import Map for Three.js CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.2/src/index.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- 🏆 Shared trophy shelf logic (global renderTrophyShelf) -->
    <script src="./trophy-shelf.js"></script>

    <!-- Main 3D game module (cache-busted) -->
    <script type="module" src="./main.js?v=2026-02-05-fire-sphere-hunt"></script>
  </body>
</html>
