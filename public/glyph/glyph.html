<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Glyph Memory - Narrrf's World</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* 🎵 Glyph page sound toggle override.
       DEVS FOR DECADES:
       The shared cheese-auth-indicator.js creates #narrrfs-sound-toggle with
       inline styles. We theme that existing shared button here with !important
       so other pages are not affected. This is visual-only and does not touch
       scoring, login, leaderboard, rewards, or database writes. */
    #narrrfs-sound-toggle {
      right: 18px !important;
      bottom: 86px !important;
      z-index: 9999 !important;
      border: 1px solid rgba(250, 204, 21, 0.72) !important;
      border-radius: 999px !important;
      padding: 10px 16px !important;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.22), transparent 42%),
        linear-gradient(135deg, rgba(9, 13, 22, 0.96), rgba(35, 24, 8, 0.94)) !important;
      color: #facc15 !important;
      font-weight: 900 !important;
      font-size: 0.82rem !important;
      letter-spacing: 0.04em !important;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.42),
        0 0 20px rgba(250, 204, 21, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04) !important;
      backdrop-filter: blur(10px) !important;
      cursor: pointer !important;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease !important;
    }

    #narrrfs-sound-toggle:hover {
      transform: translateY(-2px) scale(1.04) !important;
      border-color: rgba(34, 211, 238, 0.78) !important;
      color: #67e8f9 !important;
      box-shadow:
        0 16px 34px rgba(0, 0, 0, 0.48),
        0 0 24px rgba(34, 211, 238, 0.24) !important;
    }

   /* 🔐 Glyph page auth indicator override.
   DEVS FOR DECADES:
   cheese-auth-indicator.js creates a Tailwind-classed link, but Glyph Memory
   does not load Tailwind. These selectors theme the generated auth indicator
   only on this page and do not change login/session/backend logic. */
#cheese-auth-indicator {
  position: fixed !important;
  right: 18px !important;
  bottom: 18px !important;
  z-index: 9999 !important;
  max-width: min(260px, calc(100vw - 36px)) !important;
}

#cheese-auth-indicator a {
  display: inline-flex !important;
  align-items: center !important;
  gap: 10px !important;
  min-width: 0 !important;
  max-width: 100% !important;
  padding: 10px 14px !important;
  border-radius: 999px !important;
  border: 1px solid rgba(250, 204, 21, 0.68) !important;
  background:
    radial-gradient(circle at top left, rgba(34, 211, 238, 0.20), transparent 42%),
    linear-gradient(135deg, rgba(9, 13, 22, 0.96), rgba(35, 24, 8, 0.94)) !important;
  color: #facc15 !important;
  text-decoration: none !important;
  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.42),
    0 0 20px rgba(250, 204, 21, 0.18),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    box-shadow 0.2s ease !important;
}

#cheese-auth-indicator a:hover {
  transform: translateY(-2px) scale(1.04) !important;
  border-color: rgba(34, 211, 238, 0.78) !important;
  color: #67e8f9 !important;
  box-shadow:
    0 16px 34px rgba(0, 0, 0, 0.48),
    0 0 24px rgba(34, 211, 238, 0.24) !important;
}

#cheese-auth-indicator span {
  color: inherit !important;
  text-decoration: none !important;
}

#cheese-auth-indicator span[aria-hidden="true"] {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 32px !important;
  height: 32px !important;
  flex: 0 0 auto !important;
  border-radius: 12px !important;
  background: rgba(250, 204, 21, 0.14) !important;
  border: 1px solid rgba(250, 204, 21, 0.28) !important;
  filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.20)) !important;
}

#cheese-auth-indicator a > span:last-child {
  display: flex !important;
  min-width: 0 !important;
  flex-direction: column !important;
  line-height: 1.05 !important;
}

#cheese-auth-indicator a > span:last-child span:first-child {
  font-size: 0.78rem !important;
  font-weight: 900 !important;
  letter-spacing: 0.02em !important;
  color: #facc15 !important;
}

#cheese-auth-indicator a > span:last-child span:last-child {
  max-width: 132px !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  white-space: nowrap !important;
  font-size: 0.68rem !important;
  font-weight: 800 !important;
  color: rgba(226, 232, 240, 0.88) !important;
  opacity: 1 !important;
}

#cheese-auth-indicator[data-auth-state="logged_in"] a {
  border-color: rgba(34, 211, 238, 0.58) !important;
}

#cheese-auth-indicator[data-auth-state="logged_in"] a > span:last-child span:first-child::before {
  content: "✅ ";
}

    @media (max-width: 640px) {
      #narrrfs-sound-toggle {
        right: 12px !important;
        bottom: 88px !important;
        padding: 9px 13px !important;
        font-size: 0.72rem !important;
      }

      #cheese-auth-indicator {
  right: 12px !important;
  bottom: 16px !important;
  max-width: calc(100vw - 24px) !important;
}

#cheese-auth-indicator a {
  padding: 9px 12px !important;
}

#cheese-auth-indicator a > span:last-child span:first-child {
  font-size: 0.72rem !important;
}

#cheese-auth-indicator a > span:last-child span:last-child {
  max-width: 105px !important;
  font-size: 0.62rem !important;
}
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <!-- Background layer (optional image) -->
    <div id="bg" class="bg" aria-hidden="true"></div>

    <!-- MAIN MENU -->
    <main id="menuView" class="view view--active" role="main">
      <section class="panel" aria-label="Main menu">
        <div class="panel__header">
          <h1 class="title">Glyph Memory</h1>
          <p class="subtitle">Match the hidden glyph pairs.</p>

          <div id="userDisplay" class="user-display" style="display: none;">
            <div class="user-display__avatar-container">
              <img id="userAvatar" src="" alt="User Avatar" class="user-display__avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
            </div>
            <div class="user-display__info">
              <div class="user-display__name" id="userName">Guest</div>
              <div class="user-display__balance">
                <span id="userBalance" class="user-display__balance-value">DSPOINC: 0</span>
              </div>
            </div>
          </div>

          <!-- Login Message (shown when not logged in) -->
          <div id="loginMessage" class="login-message" style="display: none;">
            <a href="../profile.html" class="login-message__link">
              <span class="login-message__icon">🔐</span>
              <span class="login-message__text">Login with Discord to play</span>
            </a>
          </div>

          <!-- Navigation Buttons -->
          <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <!-- 🧠 Back to Lab Button -->
            <a href="../profile.html" class="lab-btn">
              <span class="lab-btn__icon">🧠</span>
              <span class="lab-btn__text">Back to Lab</span>
            </a>
          </div>
        </div>

        <div class="controls">
          <label class="label" for="difficultySelect">Select Difficulty</label>
          <select id="difficultySelect" class="select">
            <option value="easy">Easy (6 pairs)</option>
            <option value="medium">Medium (8 pairs)</option>
            <option value="hard">Hard (12 pairs)</option>
          </select>

          <div class="bestLine" aria-label="Best time">
            <span class="bestLine__label">Best</span>
            <span id="menuBestTime" class="bestLine__value">—</span>
          </div>

          <button id="startBtn" class="btn btn--primary" type="button">Start Game</button>
        </div>

        <!-- 🏆 Leaderboard Section -->
        <div id="leaderboardSection" class="leaderboard-section">
          <h3 class="leaderboard-title">🏆 Leaderboard</h3>
          <div class="leaderboard-tabs">
            <button class="tab-btn active" data-difficulty="easy">Easy</button>
            <button class="tab-btn" data-difficulty="medium">Medium</button>
            <button class="tab-btn" data-difficulty="hard">Hard</button>
          </div>
          <div id="leaderboardList" class="leaderboard-list">
            <!-- Leaderboard entries will be inserted here -->
          </div>
          <div id="leaderboardLoading" class="leaderboard-loading" hidden>Loading...</div>
          <div id="leaderboardError" class="leaderboard-error" hidden>Failed to load leaderboard</div>
        </div>

        <div class="hint">
          <span class="hint__dot"></span>
          <span>Tip: Try to beat your own time.</span>
        </div>
      </section>
    </main>

    <!-- GAME VIEW -->
    <main id="gameView" class="view" role="main">
      <header class="topbar" aria-label="Game top bar">
        <div class="topbar__left">
          <div class="stat">
            <span class="stat__label">Time</span>
            <span id="timer" class="stat__value">00:00</span>
          </div>

          <div class="stat">
            <span class="stat__label">Best</span>
            <span id="bestTime" class="stat__value">—</span>
          </div>
        </div>

        <div class="topbar__right">
          <button id="restartBtn" class="btn" type="button">Restart</button>
          <button id="menuBtn" class="btn btn--ghost" type="button">Main Menu</button>
        </div>
      </header>

      <section class="boardWrap" aria-label="Game board">
        <div id="board" class="board" role="grid" aria-label="Card grid"></div>
      </section>
    </main>

    <!-- WIN OVERLAY -->
    <div id="winOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Win screen" hidden>
      <div class="panel panel--overlay">
        <h2 class="title title--sm">You've matched all the glyphs!</h2>
        <p class="subtitle">Time: <strong id="finalTime">00:00</strong></p>
        <p class="subtitle">Best: <strong id="overlayBestTime">—</strong> <span id="newBestBadge" class="newBest" hidden>NEW BEST</span></p>

        <div class="controls controls--row">
          <button id="playAgainBtn" class="btn btn--primary" type="button">Play Again</button>
          <button id="backToMenuBtn" class="btn" type="button">Back to Menu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🔐 Shared auth and global sound toggle. Must load before game.js. -->
  <script src="../js/cheese-auth-indicator.js?v=glyph-audio-2"></script>

  <!-- 🎮 Glyph Memory logic. Bump this whenever public/glyph/game.js changes. -->
  <script src="game.js?v=glyph-audio-6"></script>
</body>
</html>
