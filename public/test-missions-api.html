<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missions API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1f2937; color: white; }
        .test-section { background: #374151; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .data-display { background: #111827; padding: 15px; border-radius: 5px; margin: 10px 0; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        input { background: #374151; color: white; border: 1px solid #6b7280; padding: 8px; border-radius: 4px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🎮 Missions API Test</h1>
    
    <div class="test-section">
        <h2>Test Missions API</h2>
        <div>
            <label>Discord ID:</label>
            <input type="text" id="discordId" placeholder="Enter Discord ID" value="123456789012345678">
            <button onclick="testMissionsAPI()">Test API</button>
        </div>
        
        <div id="results" class="data-display">
            <p>Enter a Discord ID and click "Test API" to test the missions functionality...</p>
        </div>
    </div>

    <script>
        async function testMissionsAPI() {
            const results = document.getElementById('results');
            const discordId = document.getElementById('discordId').value.trim();
            
            if (!discordId) {
                results.innerHTML = '<p class="error">❌ Please enter a Discord ID</p>';
                return;
            }
            
            results.innerHTML = '<p class="info">🔄 Testing Missions API for Discord ID: ' + discordId + '...</p>';
            
            try {
                const response = await fetch(`/api/user-game-missions.php?discord_id=${discordId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('🎮 Missions API Response:', data);
                
                if (data.success && data.games) {
                    results.innerHTML = `
                        <h3 class="success">✅ Missions API Test Successful!</h3>
                        
                        <h4>Overall Stats:</h4>
                        <ul>
                            <li>Total DSPOINC: ${data.total_dspoinc || 0}</li>
                            <li>Games Played: ${data.achievements?.games_played || 0}/5</li>
                            <li>Cheese Hunter Level: ${data.achievements?.cheese_hunter_level || 'Unknown'}</li>
                        </ul>
                        
                        <h4>Game Details:</h4>
                        <div class="data-display">
                            ${Object.entries(data.games).map(([gameKey, game]) => `
                                <div style="border: 1px solid #6b7280; padding: 10px; margin: 10px 0; border-radius: 5px;">
                                    <h5>${game.icon} ${game.name}</h5>
                                    <p>Status: <span class="${game.status === 'active' ? 'success' : 'error'}">${game.status === 'active' ? '✅ Active' : '❌ Not Played'}</span></p>
                                    <p>Stats: ${JSON.stringify(game.stats, null, 2)}</p>
                                </div>
                            `).join('')}
                        </div>
                        
                        <h4>Raw API Response:</h4>
                        <pre style="background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    results.innerHTML = `
                        <h3 class="error">❌ Missions API Test Failed</h3>
                        <p>Error: ${data.error || 'Unknown error'}</p>
                        <p>Response structure: success=${data.success}, hasGames=${!!data.games}</p>
                        <pre style="background: #000; padding: 10px; border-radius: 5px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <h3 class="error">❌ Missions API Test Error</h3>
                    <p>Error: ${error.message}</p>
                `;
                console.error('❌ Missions API Test Error:', error);
            }
        }
    </script>
</body>
</html>
